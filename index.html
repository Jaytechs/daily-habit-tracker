<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jaytechs TO DO track</title>

    <style>
      * {
        box-sizing: border-box;
        font-family: "Segoe UI", sans-serif;
      }

      body {
        margin: 0;
        background: #f4f6f8;
        color: #333;
      }

      header {
        background: #2c3e50;
        color: white;
        padding: 15px;
        text-align: center;
      }

      h2 {
        margin-top: 30px;
        color: #2c3e50;
      }

      .container {
        padding: 15px;
        max-width: 600px;
        margin: auto;
      }

      .section {
        background: white;
        padding: 15px;
        border-radius: 10px;
        margin-bottom: 20px;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05);
      }

      .task {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin: 8px 0;
      }

      .task label {
        flex: 1;
        margin-left: 10px;
      }

      .task button {
        background: none;
        border: none;
        color: red;
        font-size: 16px;
        cursor: pointer;
      }

      input[type="checkbox"] {
        transform: scale(1.2);
      }

      .add-task {
        display: flex;
        margin-top: 10px;
        gap: 5px;
      }

      .add-task input {
        flex: 1;
        padding: 8px;
      }

      .add-task button {
        padding: 8px 12px;
        background: #2c3e50;
        color: white;
        border: none;
        border-radius: 5px;
      }

      footer {
        text-align: center;
        padding: 10px;
        font-size: 14px;
        color: #666;
      }
    </style>
  </head>

  <body>
    <header>
      <h1>✅ Jaytechs TO DO track</h1>
      <p>Progress > Perfection</p>
    </header>

    <div class="container" id="app"></div>

    <footer>Built for discipline • Reset daily • God first</footer>

    <script>
      const defaultData = {
        "🌅 Morning (06:30 – 07:30)": [
          "Wake up on time",
          "Bath / hygiene",
          "Daily devotion",
          "Light exercise / stretching",
          "Breakfast & prepare for classes",
        ],
        "🎓 School (08:00 – 17:00)": [
          "Attend all scheduled lectures",
          "Pay attention (no phone)",
          "Write notes / mark unclear concepts",
          "Note at least one question",
        ],
        "🍽️ Midday Reset (12:00 – 14:00)": [
          "Eat lunch",
          "Short rest / nap",
          "Review lecture notes",
        ],
        "📚 Academic Work (14:00 – 18:00)": [
          "Worked on assignments",
          "Progressed one school task",
          "Touched school project",
          "No gaming before work",
        ],
        "💻 Skill Building (18:00 – 20:00)": [
          "Web dev or Java practice",
          "Practiced coding",
          "Saved progress",
        ],
        "🌙 Evening (20:00 – 23:30)": [
          "Dinner",
          "Interaction with people",
          "Personal growth",
          "Plan tomorrow",
          "Entertainment after work",
        ],
        "😴 Night": ["Gratitude / prayer", "Phone down", "Sleep by 22:30"],
      };

      const app = document.getElementById("app");

      let data = JSON.parse(localStorage.getItem("habits")) || defaultData;
      let checks = JSON.parse(localStorage.getItem("checks")) || {};

      function save() {
        localStorage.setItem("habits", JSON.stringify(data));
        localStorage.setItem("checks", JSON.stringify(checks));
      }

      function render() {
        app.innerHTML = "";

        Object.keys(data).forEach((section) => {
          const div = document.createElement("div");
          div.className = "section";

          const h2 = document.createElement("h2");
          h2.textContent = section;
          div.appendChild(h2);

          data[section].forEach((task, index) => {
            const taskDiv = document.createElement("div");
            taskDiv.className = "task";

            const checkbox = document.createElement("input");
            checkbox.type = "checkbox";
            checkbox.checked = checks[section]?.[index] || false;
            checkbox.onchange = () => {
              checks[section] = checks[section] || {};
              checks[section][index] = checkbox.checked;
              save();
            };

            const label = document.createElement("label");
            label.textContent = task;

            const del = document.createElement("button");
            del.textContent = "✖";
            del.onclick = () => {
              data[section].splice(index, 1);
              save();
              render();
            };

            taskDiv.appendChild(checkbox);
            taskDiv.appendChild(label);
            taskDiv.appendChild(del);
            div.appendChild(taskDiv);
          });

          const addDiv = document.createElement("div");
          addDiv.className = "add-task";

          const input = document.createElement("input");
          input.placeholder = "Add new task";

          const btn = document.createElement("button");
          btn.textContent = "Add";
          btn.onclick = () => {
            if (input.value.trim()) {
              data[section].push(input.value.trim());
              input.value = "";
              save();
              render();
            }
          };

          addDiv.appendChild(input);
          addDiv.appendChild(btn);
          div.appendChild(addDiv);

          app.appendChild(div);
        });
      }

      render();
    </script>
  </body>
</html>
